<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>借灯 · 悬疑交互故事</title>
    <link rel="stylesheet" href="assets/css/cover.css">
</head>
<body>

    <div class="cover-wrapper" id="cover">

        <!-- 雨滴层 -->
        <div class="rain-layer" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- 光晕层 -->
        <div class="glow-orb glow-orb--1" aria-hidden="true"></div>
        <div class="glow-orb glow-orb--2" aria-hidden="true"></div>

        <!-- 粒子层 -->
        <div class="particles" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span>
        </div>

        <!-- 主内容 -->
        <div class="cover-content">

            <div class="ornament-line">
                <span></span>
                <span>◆</span>
                <span></span>
            </div>

            <h1 class="game-title">
                <span class="title-main">借灯</span>
                <span class="title-sub">雨夜 · 山村 · 悬疑</span>
            </h1>

            <div class="divider">
                <span></span>
                <span>✦</span>
                <span></span>
            </div>

            <ul class="game-info">
                <li>类型：悬疑 · 交互叙事</li>
                <li>时长：约 3 小时</li>
                <li>版本：V1.0</li>
            </ul>

            <a href="./pages/authorize/login.html" class="btn-enter" id="btnEnter">
                <span class="btn-text">进入</span>
                <span class="btn-glow"></span>
            </a>

            <footer class="cover-footer">
                <p>石洞村 · 雨夜</p>
            </footer>

        </div>
    </div>

    <script>
        (function() {
            var btn = document.getElementById('btnEnter');
            if (!btn) return;

            btn.addEventListener('click', function(e) {
                var ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                var rect = this.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                ripple.addEventListener('animationend', function() {
                    this.remove();
                });
            });
        })();
    </script>

</body>
</html>

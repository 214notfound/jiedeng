<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="《借灯》游戏主界面" />
    <title>借灯 · 游戏</title>
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/game.css" />
    <link rel="stylesheet" href="../assets/css/exploration/exploration.css" />
    <link rel="stylesheet" href="../assets/css/exploration/game.css" />
  </head>
  <body data-page="game">
    <noscript>
      <p>此页面需要 JavaScript 才能运行剧情和存档。</p>
    </noscript>

    <div class="game-shell">
      <header class="game-header">
        <div class="game-header__title">
          <strong>借灯</strong>
          <small>WHITE LAMP · INTERACTIVE STORY</small>
        </div>
        <span id="chapter-name" class="chapter-name">序章</span>
        <button id="return-menu-button" class="button" type="button">返回菜单</button>
        <button id="open-inventory-button" class="button" type="button">背包</button>
        <button id="open-minigame-button" class="button" type="button" disabled>地图</button>
        <a class="button button--link" href="achievements/achievements.html">成就</a>
        <button id="save-button" class="button button--primary" type="button">保存进度</button>
      </header>

      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

      <main class="game-layout">
        <div class="game-main">
          <section id="game-scene" class="scene-panel" aria-label="当前场景" data-scene="loading">
          </section>

          <section id="exploration-actions" class="exploration-actions" aria-label="探索操作"></section>

          <section class="story-panel" aria-labelledby="story-heading">
            <h2 id="story-heading" class="visually-hidden">剧情与对话</h2>
            <div id="game-story" aria-live="polite">
              <p class="story-placeholder">雨声中，剧情正在加载……</p>
            </div>
            <div id="game-actions" class="game-actions" aria-label="可执行操作"></div>
          </section>

          <section id="inventory-panel" class="game-overlay inventory-panel" aria-label="背包与线索" tabindex="-1" hidden>
            <button id="close-inventory-button" class="button game-overlay__close" type="button">关闭背包</button>
          </section>

          <section id="detail-root" class="game-overlay detail-root" aria-label="线索详情" tabindex="-1" hidden>
            <div class="detail-card">
              <button
                id="close-detail-button"
                class="detail-card__close"
                type="button"
                aria-label="关闭详情"
              >×</button>
              <div class="detail-card__content"></div>
            </div>
          </section>

          <section id="minigame-root" class="game-overlay minigame-root" aria-label="小游戏" tabindex="-1" hidden></section>
        </div>
      </main>
    </div>

    <script defer src="../assets/js/authorize/config.js"></script>
    <script defer src="../assets/js/authorize/storage.js"></script>
    <script defer src="../assets/js/authorize/crypto.js"></script>
    <script defer src="../assets/js/authorize/auth-service.js"></script>

    <!-- 剧情内核必须严格按此顺序加载。 -->
    <script src="../assets/js/game-line/data/story-registry.js"></script>
    <script src="../assets/js/game-line/data/prologue.js"></script>
    <script src="../assets/js/game-line/data/village.js"></script>
    <script src="../assets/js/game-line/data/old-house.js"></script>
    <script src="../assets/js/game-line/data/v3/registry-extension.js"></script>
    <script src="../assets/js/game-line/data/v3/outer-investigation.js"></script>
    <script src="../assets/js/game-line/data/v3/identity-reconstruction.js"></script>
    <script src="../assets/js/game-line/data/v3/mine-return.js"></script>
    <script src="../assets/js/game-line/data/v3/finale.js"></script>
    <script src="../assets/js/game-line/game/story-validator.js"></script>
    <script src="../assets/js/game-line/game/story-runtime.js"></script>
    <script src="../assets/js/game-line/game/story-request.js"></script>
    <script src="../assets/js/game-line/game/story-engine.js"></script>

    <script type="module" src="../assets/js/core/game-page-controller.js"></script>
  </body>
</html>

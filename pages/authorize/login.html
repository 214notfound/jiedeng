<!-- 本文件提供本地演示账户登录、游客进入和异常会话恢复入口。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="White Lamp 本地演示账户登录页面" />
    <title>登录 | White Lamp</title>
    <link rel="stylesheet" href="../../assets/css/authorize.css" />
    <script defer src="../../assets/js/authorize/config.js"></script>
    <script defer src="../../assets/js/authorize/storage.js"></script>
    <script defer src="../../assets/js/authorize/crypto.js"></script>
    <script defer src="../../assets/js/authorize/auth-service.js"></script>
    <script defer src="../../assets/js/authorize/page-ui.js"></script>
    <script defer src="../../assets/js/authorize/login-page.js"></script>
  </head>
  <body>
    <noscript>
      <p class="noscript-message">此页面需要 JavaScript 才能完成本地账户验证。</p>
    </noscript>

    <div class="auth-layout">
      <aside class="auth-brand" aria-label="White Lamp 游戏标识">
        <p class="brand-mark">网页交互故事</p>
        <div class="brand-copy">
          <p class="brand-kicker">石涧村 · 雨夜</p>
          <h1 class="brand-title">WHITE<br />LAMP</h1>
          <p class="brand-description">一盏白灯照见来路，也照见被雨声掩住的名字。</p>
        </div>
        <p class="brand-meta"><span>LOCAL STORY EXPERIENCE</span><span>V1</span></p>
      </aside>

      <main class="auth-main">
        <section class="auth-panel" aria-labelledby="login-title">
          <header class="auth-heading">
            <p class="auth-eyebrow">ACCOUNT / LOGIN</p>
            <h2 id="login-title">登录本地账户</h2>
            <p>继续使用此浏览器中保存的身份。</p>
          </header>

          <div class="local-notice">
            <strong>请勿填写真实密码。</strong>
            这是课程演示账户，账户和进度仅保存在当前浏览器中。
          </div>

          <div id="page-status" class="status" role="status" aria-live="polite" hidden></div>
          <button
            id="clear-session-button"
            class="button button--secondary recovery-action"
            type="button"
            hidden
          >
            清除异常会话
          </button>

          <form id="login-form" class="auth-form" novalidate>
            <div class="form-field">
              <label class="field-label" for="username">用户名</label>
              <input
                id="username"
                class="field-input"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="20"
                placeholder="3-20 个英文字母或数字"
                aria-describedby="username-error"
                required
              />
              <p id="username-error" class="field-error" data-error-for="username"></p>
            </div>

            <div class="form-field">
              <label class="field-label" for="password">演示密码</label>
              <div class="password-control">
                <input
                  id="password"
                  class="field-input"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  maxlength="64"
                  placeholder="输入注册时设置的密码"
                  aria-describedby="password-error"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="password"
                  aria-pressed="false"
                >
                  显示
                </button>
              </div>
              <p id="password-error" class="field-error" data-error-for="password"></p>
            </div>

            <button class="button button--primary" type="submit" data-submit-control>
              登录
            </button>
          </form>

          <p class="auth-footer">
            还没有本地账户？
            <a class="text-link" href="register.html">前往注册</a>
          </p>

          <section class="guest-entry" aria-labelledby="guest-title">
            <div>
              <h3 id="guest-title">暂不注册</h3>
              <p>游客进度与注册账户分开保存，清理浏览器数据后无法恢复。</p>
            </div>
            <button id="guest-button" class="button button--secondary" type="button">
              游客进入
            </button>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>

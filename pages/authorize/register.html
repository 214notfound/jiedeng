<!-- 本文件提供本地演示账户注册和逐字段验证界面。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="White Lamp 本地演示账户注册页面" />
    <title>注册 | White Lamp</title>
    <link rel="stylesheet" href="../../assets/css/authorize.css" />
    <script defer src="../../assets/js/authorize/config.js"></script>
    <script defer src="../../assets/js/authorize/storage.js"></script>
    <script defer src="../../assets/js/authorize/crypto.js"></script>
    <script defer src="../../assets/js/authorize/auth-service.js"></script>
    <script defer src="../../assets/js/authorize/page-ui.js"></script>
    <script defer src="../../assets/js/authorize/register-page.js"></script>
  </head>
  <body>
    <noscript>
      <p class="noscript-message">此页面需要 JavaScript 才能创建本地账户。</p>
    </noscript>

    <div class="auth-layout">
      <aside class="auth-brand" aria-label="White Lamp 游戏标识">
        <p class="brand-mark">网页交互故事</p>
        <div class="brand-copy">
          <p class="brand-kicker">石涧村 · 雨夜</p>
          <h1 class="brand-title">WHITE<br />LAMP</h1>
          <p class="brand-description">名字会被记住，来时的路却未必。请只为这次演示留下一个身份。</p>
        </div>
        <p class="brand-meta"><span>LOCAL STORY EXPERIENCE</span><span>V1</span></p>
      </aside>

      <main class="auth-main">
        <section class="auth-panel" aria-labelledby="register-title">
          <header class="auth-heading">
            <p class="auth-eyebrow">ACCOUNT / REGISTER</p>
            <h2 id="register-title">创建本地账户</h2>
            <p>注册完成后返回登录页，不会自动登录。</p>
          </header>

          <div class="local-notice">
            <strong>请设置仅用于本次演示的密码。</strong>
            纯前端账户不具备真实网站的安全性，请勿复用真实密码或填写敏感信息。
          </div>

          <div id="page-status" class="status" role="status" aria-live="polite" hidden></div>

          <form id="register-form" class="auth-form" novalidate>
            <div class="form-field">
              <label class="field-label" for="username">用户名</label>
              <input
                id="username"
                class="field-input"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="20"
                placeholder="例如 Player01"
                aria-describedby="username-hint username-error"
                required
              />
              <p id="username-hint" class="field-hint">3-20 个英文字母或数字，重名不区分大小写。</p>
              <p id="username-error" class="field-error" data-error-for="username"></p>
            </div>

            <div class="form-field">
              <label class="field-label" for="password">演示密码</label>
              <div class="password-control">
                <input
                  id="password"
                  class="field-input"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  maxlength="64"
                  placeholder="6-64 个字符"
                  aria-describedby="password-error"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="password"
                  aria-pressed="false"
                >
                  显示
                </button>
              </div>
              <p id="password-error" class="field-error" data-error-for="password"></p>
            </div>

            <div class="form-field">
              <label class="field-label" for="confirm-password">确认演示密码</label>
              <div class="password-control">
                <input
                  id="confirm-password"
                  class="field-input"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  maxlength="64"
                  placeholder="再次输入相同密码"
                  aria-describedby="confirm-password-error"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  data-password-toggle="confirm-password"
                  aria-pressed="false"
                >
                  显示
                </button>
              </div>
              <p
                id="confirm-password-error"
                class="field-error"
                data-error-for="confirmPassword"
              ></p>
            </div>

            <div class="checkbox-field">
              <input
                id="accepted-storage"
                name="acceptedStorage"
                type="checkbox"
                aria-describedby="accepted-storage-error"
              />
              <label for="accepted-storage">
                我已了解账户仅保存在当前浏览器，并同意使用本地存储保存演示账户。
              </label>
              <p
                id="accepted-storage-error"
                class="field-error"
                data-error-for="acceptedStorage"
              ></p>
            </div>

            <button class="button button--primary" type="submit" data-submit-control>
              注册账户
            </button>
          </form>

          <p class="auth-footer">
            已有本地账户？
            <a class="text-link" href="login.html">返回登录</a>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>

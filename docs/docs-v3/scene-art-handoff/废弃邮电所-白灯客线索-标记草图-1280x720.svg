<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="140" y="110" width="1000" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="140" y="470" width="1000" height="250" fill="#161e2a"/>
  <circle cx="640" cy="160" r="120" fill="url(#lamp)"/>
  <rect x="300" y="360" width="680" height="130" fill="#3a2f24" stroke="#5a4836" stroke-width="3"/>
  <rect x="300" y="360" width="680" height="16" fill="#c8bfa8"/>
  <text x="640" y="90" fill="#b7c4d0" font-size="15" text-anchor="middle">废弃邮电所（白灯客线索）</text>

  <!-- W00 灯形条款提醒｜23,32 -->
  <g>
    <rect x="170" y="150" width="180" height="150" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="184" y="166" width="120" height="12" fill="#999"/>
    <rect x="184" y="186" width="140" height="8" fill="#999"/>
    <rect x="184" y="202" width="100" height="8" fill="#999"/>
    <path d="M230,240 L250,220 L270,240 L250,262 Z" fill="#d8c6a4" opacity="0.9"/>
    <circle cx="250" cy="242" r="8" fill="#f5e9d0"/>
    <circle cx="300" cy="230" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="244" y1="230" x2="356" y2="230" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="174" x2="300" y2="286" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="230" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="128" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">W00 · 灯形条款提醒｜23,32</text>
    <text x="300" y="148" fill="#b7c4d0" font-size="13" text-anchor="middle">白灯客帮村民规避不利条款</text>
  </g>

  <!-- W02 变声警告录音｜23,69 -->
  <g>
    <rect x="170" y="440" width="220" height="90" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="200" y="400" width="120" height="60" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <circle cx="220" cy="430" r="14" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
    <circle cx="300" cy="430" r="14" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
    <circle cx="300" cy="500" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="244" y1="500" x2="356" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="444" x2="300" y2="556" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="500" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="602" fill="#5aa7ff" font-size="18" font-weight="bold" text-anchor="middle">W02 · 变声警告录音｜23,69</text>
    <text x="300" y="622" fill="#b7c4d0" font-size="13" text-anchor="middle">「不要急着认领任何名字」</text>
  </g>

  <!-- W01 投递日期记录｜48,46 -->
  <g>
    <rect x="540" y="290" width="200" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="554" y="306" width="140" height="10" fill="#999"/>
    <rect x="554" y="326" width="160" height="8" fill="#999"/>
    <rect x="554" y="344" width="100" height="8" fill="#c17a74"/>
    <circle cx="620" cy="330" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="564" y1="330" x2="676" y2="330" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="620" y1="274" x2="620" y2="386" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="620" cy="330" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="620" y="250" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">W01 · 投递日期记录｜48,46</text>
    <text x="620" y="270" fill="#b7c4d0" font-size="13" text-anchor="middle">所有材料均晚于苏禾失踪</text>
  </g>

  <!-- W03 匿名举报草稿｜77,69 -->
  <g>
    <rect x="880" y="300" width="200" height="70" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="894" y="314" width="150" height="8" fill="#999"/>
    <rect x="894" y="330" width="120" height="8" fill="#999"/>
    <rect x="894" y="346" width="160" height="8" fill="#999"/>
    <rect x="900" y="470" width="160" height="60" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <circle cx="980" cy="500" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="924" y1="500" x2="1036" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="980" y1="444" x2="980" y2="556" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="980" cy="500" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="980" y="604" fill="#5aa7ff" font-size="18" font-weight="bold" text-anchor="middle">W03 · 匿名举报草稿｜77,69</text>
    <text x="980" y="624" fill="#b7c4d0" font-size="13" text-anchor="middle">每到王阙执行记录就中断</text>
  </g>
</svg>

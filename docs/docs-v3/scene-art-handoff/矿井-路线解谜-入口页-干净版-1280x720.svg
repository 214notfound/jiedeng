<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#mine)"/>

  <!-- 封井区：两道挡墙 -->
  <rect x="120" y="120" width="1040" height="480" fill="#1a2028" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="430" y="240" width="140" height="300" fill="#2b3442" stroke="#5a4836" stroke-width="3"/>
  <rect x="700" y="240" width="140" height="300" fill="#2b3442" stroke="#5a4836" stroke-width="3"/>
  <rect x="430" y="240" width="410" height="40" fill="#3a4a52"/>
  <text x="640" y="300" fill="#b7c4d0" font-size="16" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">封井 · 速凝浆</text>

  <!-- M00 原始矿图 -->
  <g>
    <rect x="170" y="210" width="160" height="90" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="184" y="224" width="132" height="62" fill="#2b3442" stroke="#4a6b8a" stroke-width="2"/>
    <circle cx="250" cy="255" r="8" fill="#ffb347" opacity="0.85"/>
    <rect x="184" y="292" width="110" height="6" fill="#999"/>
  </g>

  <!-- M02 排水洞与供电盲区 -->
  <g>
    <rect x="900" y="210" width="160" height="90" fill="#1c2028" stroke="#4a6b8a" stroke-width="2" rx="6"/>
    <circle cx="980" cy="255" r="34" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3"/>
    <circle cx="980" cy="255" r="34" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- M03 两道挡墙/废石/速凝浆（中央） -->
  <g>
    <rect x="560" y="360" width="160" height="80" fill="#232b38" stroke="#5a4836" stroke-width="2" rx="3"/>
    <rect x="574" y="374" width="60" height="24" fill="#3a2f24"/>
    <rect x="646" y="374" width="60" height="24" fill="#3a2f24"/>
    <rect x="574" y="408" width="132" height="14" fill="#4a5568"/>
  </g>

  <!-- M04 材料对比 -->
  <g>
    <rect x="170" y="500" width="160" height="90" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="184" y="514" width="132" height="10" fill="#999"/>
    <rect x="184" y="532" width="100" height="10" fill="#999"/>
    <rect x="184" y="550" width="120" height="10" fill="#c17a74"/>
  </g>

  <!-- M05 内部平台 -->
  <g>
    <rect x="900" y="500" width="160" height="90" fill="#1c2028" stroke="#4a6b8a" stroke-width="2" rx="3"/>
    <rect x="914" y="514" width="132" height="62" fill="#0a0f16" stroke="#4a6b8a" stroke-width="2"/>
    <rect x="946" y="540" width="68" height="36" fill="#2b3442"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161e"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#mine)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="100" y="100" width="1080" height="540" fill="#1a2028" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="100" y="640" width="1080" height="80" fill="#10141a"/>
  <rect x="540" y="170" width="200" height="480" fill="#030406" stroke="#3a4a5c" stroke-width="3"/>
  <rect x="560" y="200" width="160" height="420" fill="#000000"/>
  <text x="640" y="360" fill="#4a5568" font-size="15" text-anchor="middle">竖井边</text>
  <text x="640" y="76" fill="#b7c4d0" font-size="15" text-anchor="middle">矿井内部 · 苏禾死亡现场（无剪影、无尸身）</text>

  <!-- M06 文件袋/录音笔｜31,53（内含 M07–M12 完整录音 + M15 主角声音） -->
  <g>
    <rect x="320" y="340" width="160" height="90" fill="#3a2f24" stroke="#5a4836" stroke-width="2" rx="4"/>
    <rect x="336" y="356" width="128" height="58" fill="#2b221a"/>
    <rect x="480" y="360" width="60" height="44" fill="#232b38" stroke="#4a6b8a" stroke-width="2" rx="4"/>
    <circle cx="510" cy="382" r="10" fill="#5aa7ff" opacity="0.7"/>
    <circle cx="400" cy="380" r="80" fill="url(#lamp)"/>
    <circle cx="400" cy="380" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="350" y1="380" x2="450" y2="380" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="400" y1="330" x2="400" y2="430" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="400" cy="380" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="400" y="322" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">M06 · 文件袋/录音笔｜31,53</text>
    <text x="400" y="470" fill="#b7c4d0" font-size="13" text-anchor="middle">M07–M12 完整录音 + M15 主角声音（捆绑播放）</text>
  </g>

  <!-- M13 封井记录｜62,42 -->
  <g>
    <rect x="740" y="270" width="130" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="754" y="284" width="100" height="8" fill="#999"/>
    <rect x="754" y="300" width="80" height="8" fill="#999"/>
    <rect x="754" y="316" width="100" height="8" fill="#c17a74"/>
    <circle cx="800" cy="300" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="750" y1="300" x2="850" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="800" y1="250" x2="800" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="800" cy="300" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="800" y="246" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">M13 · 封井记录｜62,42</text>
  </g>

  <!-- M14 手机取卡/轨迹伪造｜62,70 -->
  <g>
    <rect x="740" y="470" width="80" height="130" fill="#0e151f" stroke="#4a6b8a" stroke-width="2" rx="8"/>
    <rect x="756" y="486" width="48" height="60" fill="#2b3442"/>
    <rect x="756" y="554" width="48" height="10" fill="#5aa7ff" opacity="0.5"/>
    <rect x="826" y="500" width="26" height="16" fill="#8a7a5c" stroke="#c8bfa8" stroke-width="1"/>
    <circle cx="800" cy="500" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="750" y1="500" x2="850" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="800" y1="450" x2="800" y2="550" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="800" cy="500" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="800" y="630" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">M14 · 手机取卡/轨迹伪造｜62,70</text>
  </g>

  <!-- M16 服务器索引｜31,78 -->
  <g>
    <rect x="320" y="520" width="150" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="334" y="534" width="120" height="8" fill="#999"/>
    <rect x="334" y="550" width="90" height="8" fill="#999"/>
    <rect x="334" y="566" width="110" height="8" fill="#5aa7ff" opacity="0.6"/>
    <circle cx="400" cy="560" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="350" y1="560" x2="450" y2="560" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="400" y1="510" x2="400" y2="610" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="400" cy="560" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="400" y="650" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">M16 · 服务器索引｜31,78</text>
  </g>

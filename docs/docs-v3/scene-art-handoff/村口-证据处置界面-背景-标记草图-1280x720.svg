<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#141c28"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3a4a5c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#night)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <path d="M0 320 L180 180 L360 300 L560 150 L760 290 L960 170 L1150 300 L1280 240 L1280 440 L0 440 Z" fill="#161d28"/>
  <rect x="0" y="360" width="1280" height="140" fill="url(#fog)"/>

  <g>
    <rect x="150" y="180" width="60" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="1070" y="180" width="60" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="120" y="150" width="1040" height="60" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <text x="640" y="192" fill="#c8bfa8" font-size="26" text-anchor="middle">借灯村</text>
  </g>

  <g>
    <line x1="980" y1="210" x2="980" y2="270" stroke="#5a4836" stroke-width="3"/>
    <rect x="954" y="270" width="52" height="60" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="4"/>
    <circle cx="980" cy="300" r="90" fill="url(#lamp)"/>
  </g>

  <rect x="0" y="500" width="1280" height="220" fill="#10161f"/>
  <rect x="0" y="500" width="1280" height="6" fill="#2b3442"/>

  <text x="640" y="90" fill="#b7c4d0" font-size="15" text-anchor="middle">村口 · 证据处置界面（背景图，UI 归高冰轩）</text>

  <!-- 4 证据组卡片区（UI 覆盖层，归高冰轩） -->
  <g>
    <rect x="150" y="470" width="225" height="70" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <rect x="400" y="470" width="225" height="70" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <rect x="650" y="470" width="225" height="70" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <rect x="900" y="470" width="225" height="70" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <text x="640" y="460" fill="#5aa7ff" font-size="15" font-weight="bold" text-anchor="middle">四组证据卡片（UI，归高冰轩）</text>
  </g>

  <!-- 3 按钮区（UI 覆盖层，归高冰轩） -->
  <g>
    <rect x="300" y="640" width="200" height="56" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <rect x="540" y="640" width="200" height="56" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <rect x="780" y="640" width="200" height="56" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <text x="640" y="712" fill="#f5c542" font-size="15" font-weight="bold" text-anchor="middle">T17 销毁全部 ｜ T18 公开精选 ｜ T19 公开全部（按钮，归卢正松/高冰轩）</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>
  <rect x="140" y="110" width="1000" height="380" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="140" y="490" width="1000" height="230" fill="#161e2a"/>
  <circle cx="640" cy="160" r="120" fill="url(#lamp)"/>

  <!-- B20 系统图纸（左墙，拼合图纸） -->
  <g>
    <rect x="180" y="140" width="200" height="150" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="196" y="158" width="120" height="8" fill="#999"/>
    <rect x="196" y="174" width="150" height="8" fill="#999"/>
    <path d="M200,220 L260,190 L320,230 L260,260 Z" fill="none" stroke="#5aa7ff" stroke-width="2"/>
    <path d="M200,220 L260,190" stroke="#c17a74" stroke-width="2"/>
  </g>

  <!-- B21 操作台（中央大台） -->
  <g>
    <rect x="440" y="330" width="360" height="120" fill="#2b3442" stroke="#4a5568" stroke-width="3"/>
    <rect x="460" y="300" width="320" height="40" fill="#0e2233" stroke="#4a5568" stroke-width="2"/>
    <rect x="480" y="310" width="40" height="20" fill="#c17a74"/>
    <rect x="540" y="310" width="40" height="20" fill="#5aa7ff"/>
    <rect x="600" y="310" width="40" height="20" fill="#5a4836"/>
    <rect x="470" y="360" width="300" height="14" fill="#0e1218"/>
  </g>

  <!-- B22 调试日志屏（右上） -->
  <g>
    <rect x="900" y="150" width="200" height="120" fill="#0e2233" stroke="#4a5568" stroke-width="2"/>
    <rect x="916" y="168" width="140" height="8" fill="#5aa7ff" opacity="0.7"/>
    <rect x="916" y="184" width="120" height="8" fill="#3a4a5c"/>
    <rect x="916" y="200" width="160" height="8" fill="#3a4a5c"/>
    <rect x="916" y="216" width="90" height="8" fill="#3a4a5c"/>
  </g>

  <!-- B23 低清录像屏（右中） -->
  <g>
    <rect x="900" y="320" width="200" height="130" fill="#0e2233" stroke="#4a5568" stroke-width="2"/>
    <rect x="916" y="336" width="170" height="90" fill="#14283a"/>
    <circle cx="980" cy="380" r="22" fill="#0e1218" stroke="#5aa7ff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- B24 会议摘要（左下柜） -->
  <g>
    <rect x="180" y="440" width="200" height="160" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="200" y="460" width="160" height="24" fill="#2b3442"/>
    <rect x="200" y="494" width="160" height="24" fill="#2b3442"/>
    <rect x="212" y="470" width="90" height="8" fill="#c17a74"/>
  </g>

  <!-- B25 老人跌亡记录（中下柜） -->
  <g>
    <rect x="500" y="500" width="220" height="130" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="520" y="520" width="180" height="24" fill="#2b3442"/>
    <rect x="530" y="528" width="100" height="8" fill="#c17a74"/>
  </g>

</svg>

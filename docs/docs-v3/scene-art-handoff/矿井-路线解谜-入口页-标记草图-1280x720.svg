  <g>
    <rect x="170" y="210" width="160" height="90" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="184" y="224" width="132" height="62" fill="#2b3442" stroke="#4a6b8a" stroke-width="2"/>
    <circle cx="250" cy="255" r="8" fill="#ffb347" opacity="0.85"/>
    <rect x="184" y="292" width="110" height="6" fill="#999"/>
    <circle cx="250" cy="250" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="200" y1="250" x2="300" y2="250" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="250" y1="200" x2="250" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="250" cy="250" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

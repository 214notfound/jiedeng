    <line x1="250" y1="500" x2="250" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="250" cy="550" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

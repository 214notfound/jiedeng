    <circle cx="1000" cy="250" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="950" y1="250" x2="1050" y2="250" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="200" x2="1000" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

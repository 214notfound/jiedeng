  <!-- M01 小周立绘（覆盖层，非背景）｜建议错误山口，对白非机关 -->
  <g>
    <rect x="500" y="150" width="240" height="150" fill="none" stroke="#7fd1c8" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
    <text x="620" y="170" fill="#7fd1c8" font-size="15" font-weight="bold" text-anchor="middle">M01 · 小周立绘（覆盖层，非背景）· 建议错误山口（对白，非机关）</text>

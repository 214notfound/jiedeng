    <line x1="950" y1="550" x2="1050" y2="550" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="500" x2="1000" y2="600" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

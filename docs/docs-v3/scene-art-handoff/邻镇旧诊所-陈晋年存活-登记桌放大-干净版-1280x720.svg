<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d16"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#desk)"/>

  <!-- 登记桌特写：桌面 + 台灯 -->
  <rect x="120" y="160" width="1040" height="460" fill="#3a2f24" stroke="#5a4836" stroke-width="3"/>
  <rect x="120" y="160" width="1040" height="20" fill="#c8bfa8"/>
  <circle cx="640" cy="200" r="100" fill="url(#lamp)"/>

  <!-- A20 诊所账簿 -->
  <g>
    <rect x="180" y="240" width="120" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="192" y="254" width="80" height="8" fill="#999"/>
    <rect x="192" y="270" width="96" height="8" fill="#999"/>
    <rect x="192" y="286" width="64" height="8" fill="#999"/>
  </g>

  <!-- A21 伤情图/转诊记录 -->
  <g>
    <rect x="440" y="240" width="120" height="90" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="452" y="254" width="70" height="60" fill="#2b3442"/>
    <rect x="452" y="322" width="96" height="6" fill="#999"/>
  </g>

  <!-- A22 伤疤比对 -->
  <g>
    <rect x="700" y="240" width="120" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <circle cx="760" cy="280" r="20" fill="#2b3442" stroke="#c17a74" stroke-width="2"/>
    <rect x="712" y="310" width="96" height="6" fill="#999"/>
  </g>

  <!-- A23 采药人转述 -->
  <g>
    <rect x="960" y="240" width="130" height="84" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="974" y="254" width="100" height="8" fill="#999"/>
    <rect x="974" y="270" width="90" height="8" fill="#999"/>
    <rect x="974" y="286" width="102" height="8" fill="#999"/>
  </g>

  <!-- A24 搜救终止文件 -->
  <g>
    <rect x="310" y="500" width="130" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="324" y="514" width="90" height="8" fill="#999"/>
    <rect x="324" y="530" width="100" height="8" fill="#999"/>
    <rect x="324" y="546" width="70" height="8" fill="#c17a74"/>
  </g>

  <!-- A25 户籍/年龄/伤痕链 -->
  <g>
    <rect x="600" y="500" width="130" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="614" y="514" width="100" height="8" fill="#999"/>
    <rect x="614" y="530" width="86" height="8" fill="#999"/>
    <rect x="614" y="546" width="100" height="8" fill="#999"/>
  </g>

  <!-- A26 蓝玻璃珠 -->
  <g>
    <circle cx="950" cy="520" r="16" fill="#5aa7ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="946" cy="514" r="5" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>

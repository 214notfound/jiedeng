    <line x1="244" y1="480" x2="356" y2="480" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="424" x2="300" y2="536" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="480" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="602" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">S02 · 旧矿图复印件藏点｜23,67</text>
    <text x="300" y="622" fill="#b7c4d0" font-size="13" text-anchor="middle">讲台抽屉 / 父辈证言索引</text>
  </g>

  <!-- S03 封井材料照片｜48,67 -->
  <g>
    <rect x="520" y="440" width="220" height="100" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="560" y="390" width="80" height="60" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="566" y="396" width="68" height="40" fill="#2b3442"/>
    <circle cx="620" cy="480" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="564" y1="480" x2="676" y2="480" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="620" y1="424" x2="620" y2="536" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="620" cy="480" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

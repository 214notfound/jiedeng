<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="140" y="110" width="1000" height="380" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="140" y="490" width="1000" height="230" fill="#161e2a"/>
  <circle cx="640" cy="150" r="120" fill="url(#lamp)"/>
  <text x="640" y="90" fill="#b7c4d0" font-size="15" text-anchor="middle">废弃小学教室（苏禾线路）</text>

  <!-- S00 留言/寻人启事｜23,31 -->
  <g>
    <rect x="180" y="150" width="260" height="150" fill="#14282e" stroke="#4a5568" stroke-width="2"/>
    <rect x="200" y="170" width="80" height="100" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="208" y="182" width="56" height="10" fill="#999"/>
    <rect x="208" y="200" width="64" height="8" fill="#999"/>
    <rect x="208" y="216" width="48" height="8" fill="#999"/>
    <circle cx="300" cy="220" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="244" y1="220" x2="356" y2="220" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="164" x2="300" y2="276" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="220" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="118" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">S00 · 留言/寻人启事｜23,31</text>
    <text x="300" y="138" fill="#b7c4d0" font-size="13" text-anchor="middle">教案边缘线路标记</text>
  </g>

  <!-- S01 广播/电/排水线路｜78,29 -->
  <g>
    <path d="M940,120 L960,120 L960,240 L900,300" fill="none" stroke="#2b3442" stroke-width="6"/>
    <path d="M960,180 L1040,180 L1040,260" fill="none" stroke="#3a4a5c" stroke-width="4"/>
    <rect x="930" y="112" width="40" height="16" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <circle cx="1040" cy="268" r="12" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <circle cx="1000" cy="210" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="944" y1="210" x2="1056" y2="210" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="154" x2="1000" y2="266" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1000" cy="210" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="1000" y="96" fill="#5aa7ff" font-size="18" font-weight="bold" text-anchor="middle">S01 · 广播/电/排水线路｜78,29</text>
    <text x="1000" y="116" fill="#b7c4d0" font-size="13" text-anchor="middle">三类装置共同物理网络</text>
  </g>


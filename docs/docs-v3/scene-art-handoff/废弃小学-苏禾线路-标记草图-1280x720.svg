    <text x="620" y="642" fill="#b7c4d0" font-size="13" text-anchor="middle">公司失踪前已备封井</text>
  </g>

  <!-- S04 手机移动记录｜77,67 -->
  <g>
    <rect x="880" y="440" width="200" height="90" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="960" y="392" width="46" height="70" rx="6" fill="#0e1218" stroke="#4a5568" stroke-width="2"/>
    <rect x="966" y="400" width="34" height="44" fill="#14283a"/>
    <circle cx="980" cy="480" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="924" y1="480" x2="1036" y2="480" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="980" y1="424" x2="980" y2="536" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="980" cy="480" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="980" y="626" fill="#5aa7ff" font-size="18" font-weight="bold" text-anchor="middle">S04 · 手机移动记录｜77,67</text>
    <text x="980" y="646" fill="#b7c4d0" font-size="13" text-anchor="middle">「自行离村」轨迹异常</text>
  </g>

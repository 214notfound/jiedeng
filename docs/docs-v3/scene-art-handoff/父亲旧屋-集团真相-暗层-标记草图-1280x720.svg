  <g>
    <rect x="390" y="646" width="500" height="50" fill="#0d1118" stroke="#f5c542" stroke-width="2" rx="6"/>
    <text x="640" y="676" fill="#f5c542" font-size="18" font-weight="bold" text-anchor="middle">F09 · 主角说出「父亲既是受害者也是帮凶」（归档，非热点）</text>
  </g>

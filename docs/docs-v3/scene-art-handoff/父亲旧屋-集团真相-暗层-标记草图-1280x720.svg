  <circle cx="640" cy="150" r="120" fill="url(#lamp)"/>
  <text x="640" y="86" fill="#b7c4d0" font-size="15" text-anchor="middle">暗层 · 证据墙（F01–F08）</text>

  <!-- F01 原始矿图/爆破日志｜19,33 -->
  <g>

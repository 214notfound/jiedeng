    <line x1="470" y1="240" x2="570" y2="240" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="520" y1="190" x2="520" y2="290" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

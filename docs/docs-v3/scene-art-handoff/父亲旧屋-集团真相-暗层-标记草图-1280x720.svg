    <text x="800" y="630" fill="#b7c4d0" font-size="13" text-anchor="middle">集团收购吞并对象</text>
  </g>

  <!-- F08 风险谈话｜80,69 -->
  <g>
    <rect x="1030" y="460" width="110" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="1042" y="474" width="86" height="8" fill="#999"/>
    <rect x="1042" y="490" width="60" height="8" fill="#999"/>
    <rect x="1042" y="506" width="80" height="8" fill="#c17a74"/>
    <circle cx="1080" cy="500" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="1030" y1="500" x2="1130" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1080" y1="450" x2="1080" y2="550" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1080" cy="500" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

  <g>
    <rect x="750" y="460" width="110" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="762" y="474" width="86" height="8" fill="#999"/>
    <rect x="762" y="490" width="76" height="8" fill="#999"/>
    <rect x="762" y="506" width="70" height="8" fill="#999"/>
    <circle cx="800" cy="500" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="750" y1="500" x2="850" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="800" y1="450" x2="800" y2="550" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

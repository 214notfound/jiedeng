    <line x1="190" y1="240" x2="290" y2="240" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="240" y1="190" x2="240" y2="290" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="240" cy="240" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

    <circle cx="333" cy="396" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="277" y1="396" x2="389" y2="396" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="333" y1="340" x2="333" y2="452" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

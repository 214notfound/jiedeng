  </g>

  <!-- G04 小周立绘（覆盖层，非背景）｜80,78 -->
  <g>
    <rect x="950" y="506" width="148" height="180" fill="none" stroke="#7fd1c8" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <text x="1024" y="660" fill="#7fd1c8" font-size="16" font-weight="bold" text-anchor="middle">G04 · 小周立绘（覆盖层，非背景）｜80,78</text>
    <text x="1024" y="680" fill="#b7c4d0" font-size="13" text-anchor="middle">过度关注票据编号 · 非对话 handoff</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c28"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#night)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <path d="M0,520 L640,300 L1280,360 L1280,720 L0,720 Z" fill="#121a26"/>
  <path d="M120,560 L600,330 L1240,380 L1240,460 L640,400 L80,620 Z" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <text x="640" y="690" fill="#b7c4d0" font-size="14" text-anchor="middle">山腰旧运输道（雨夜）</text>

  <!-- G00 坍方边缘｜28,24 -->
  <g>
    <path d="M240,120 L420,120 L360,260 L280,250 Z" fill="#0e1218" stroke="#4a5568" stroke-width="2"/>

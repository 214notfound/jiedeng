    <line x1="360" y1="170" x2="380" y2="200" stroke="#5a4836" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="358" cy="173" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="302" y1="173" x2="414" y2="173" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="358" y1="117" x2="358" y2="229" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="358" cy="173" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="358" y="78" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">G00 · 坍方边缘｜28,24</text>
    <text x="358" y="98" fill="#b7c4d0" font-size="13" text-anchor="middle">旧送葬路线 / 坠沟地形</text>
  </g>

  <!-- G01 浅沟/排水洞｜60,42 -->
  <g>
    <ellipse cx="768" cy="320" rx="120" ry="60" fill="#0e1218" stroke="#3a4a5c" stroke-width="2"/>
    <ellipse cx="768" cy="310" rx="60" ry="30" fill="#05070c"/>
    <path d="M660,330 C700,290 760,280 860,300" fill="none" stroke="#2b3442" stroke-width="6"/>
    <circle cx="768" cy="302" r="58" fill="none" stroke="#5aa7ff" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="712" y1="302" x2="824" y2="302" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="768" y1="246" x2="768" y2="358" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="768" cy="302" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

    <circle cx="947" cy="432" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="891" y1="432" x2="1003" y2="432" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="947" y1="376" x2="947" y2="488" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="947" cy="432" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

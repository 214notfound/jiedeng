  <g>
    <rect x="920" y="440" width="180" height="150" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="934" y="458" width="150" height="24" fill="#2b3442"/>
    <rect x="934" y="492" width="150" height="24" fill="#2b3442"/>
    <rect x="946" y="500" width="60" height="10" fill="#c17a74"/>
    <circle cx="1000" cy="490" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="944" y1="490" x2="1056" y2="490" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="434" x2="1000" y2="546" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1000" cy="490" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

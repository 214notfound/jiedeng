    <line x1="564" y1="360" x2="676" y2="360" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="620" y1="304" x2="620" y2="416" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="620" cy="360" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="620" y="266" fill="#5aa7ff" font-size="18" font-weight="bold" text-anchor="middle">R04 · 遮名背景调查｜48,50</text>

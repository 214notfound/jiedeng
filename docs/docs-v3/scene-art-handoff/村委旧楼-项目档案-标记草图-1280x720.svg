  <g>
    <rect x="150" y="430" width="180" height="120" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="164" y="446" width="120" height="10" fill="#999"/>
    <rect x="164" y="466" width="140" height="8" fill="#999"/>
    <rect x="164" y="484" width="100" height="8" fill="#999"/>

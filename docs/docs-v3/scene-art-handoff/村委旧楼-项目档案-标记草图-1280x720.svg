    <line x1="184" y1="500" x2="296" y2="500" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="240" y1="444" x2="240" y2="556" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

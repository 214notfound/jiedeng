    <line x1="944" y1="230" x2="1056" y2="230" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="174" x2="1000" y2="286" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="120" y="120" width="1040" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="120" y="480" width="1040" height="240" fill="#161e2a"/>
  <circle cx="640" cy="160" r="120" fill="url(#lamp)"/>
  <text x="640" y="90" fill="#b7c4d0" font-size="15" text-anchor="middle">村委旧楼 / 临时项目部室内</text>

  <!-- R00 门禁/工作证｜19,33 -->
  <g>
    <rect x="150" y="200" width="120" height="220" fill="#0e1218" stroke="#5a4836" stroke-width="3"/>
    <rect x="200" y="300" width="34" height="52" fill="#232b38" stroke="#4a5568" stroke-width="2"/>

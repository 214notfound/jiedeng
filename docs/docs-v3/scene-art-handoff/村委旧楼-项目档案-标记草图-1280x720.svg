    <circle cx="240" cy="240" r="58" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="184" y1="240" x2="296" y2="240" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="240" y1="184" x2="240" y2="296" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="240" cy="240" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="dc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#06090e"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa7ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5aa7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#dc)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="110" y="100" width="1060" height="500" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="110" y="600" width="1060" height="120" fill="#0c1018"/>
  <text x="640" y="84" fill="#b7c4d0" font-size="15" text-anchor="middle">数据机房 · 对峙（入口页）</text>

  <!-- T12 供电范围/延时器/排水线｜23,42 -->
  <g>
    <rect x="180" y="220" width="200" height="160" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3" rx="4"/>
    <rect x="196" y="238" width="168" height="12" fill="#5aa7ff" opacity="0.6"/>
    <rect x="196" y="260" width="130" height="12" fill="#5aa7ff" opacity="0.45"/>
    <rect x="196" y="282" width="150" height="12" fill="#ffb347" opacity="0.6"/>
    <rect x="196" y="304" width="100" height="12" fill="#5aa7ff" opacity="0.35"/>
    <circle cx="300" cy="300" r="90" fill="url(#screen)"/>
    <circle cx="300" cy="300" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="250" y1="300" x2="350" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="250" x2="300" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="300" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="210" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">T12 · 供电范围/延时器/排水线｜23,42</text>
    <text x="300" y="500" fill="#b7c4d0" font-size="13" text-anchor="middle">追逐机关（小游戏内交互）</text>
  </g>

  <!-- T13 安保封锁/副本删除压力｜78,42 -->
  <g>
    <rect x="900" y="220" width="200" height="160" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3" rx="4"/>
    <rect x="916" y="238" width="168" height="12" fill="#ff4757" opacity="0.6"/>
    <rect x="916" y="260" width="130" height="12" fill="#ff4757" opacity="0.5"/>
    <rect x="916" y="282" width="150" height="12" fill="#5aa7ff" opacity="0.4"/>
    <rect x="916" y="304" width="100" height="12" fill="#ff4757" opacity="0.4"/>
    <circle cx="1000" cy="300" r="90" fill="url(#screen)"/>
    <circle cx="1000" cy="300" r="52" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="950" y1="300" x2="1050" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="1000" y1="250" x2="1000" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1000" cy="300" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="1000" y="210" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">T13 · 安保封锁/副本删除压力｜78,42</text>
    <text x="1000" y="500" fill="#b7c4d0" font-size="13" text-anchor="middle">追逐机关（小游戏内交互）</text>
  </g>

  <!-- 小周立绘（覆盖层，非背景）· 对话 x-recovery-demand｜50,53 -->
  <g>
    <rect x="540" y="330" width="200" height="230" fill="none" stroke="#7fd1c8" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <text x="640" y="160" fill="#7fd1c8" font-size="18" font-weight="bold" text-anchor="middle">小周立绘（覆盖层，非背景）· 对话 x-recovery-demand｜50,53</text>
    <text x="640" y="576" fill="#b7c4d0" font-size="14" text-anchor="middle">说明目的：一路陪同、重启装置、监视调查，是要主角找齐并交回证据</text>
  </g>

  <!-- 交证/拒绝按钮区（CHOICE_MADE，归卢正松/高冰轩） -->
  <g>
    <rect x="360" y="620" width="560" height="56" fill="none" stroke="#f5c542" stroke-width="2" stroke-dasharray="8 5" rx="6"/>
    <text x="640" y="654" fill="#f5c542" font-size="16" font-weight="bold" text-anchor="middle">交证 / 拒绝（CHOICE_MADE 按钮，底部安全区，归卢正松/高冰轩）</text>
  </g>
</svg>

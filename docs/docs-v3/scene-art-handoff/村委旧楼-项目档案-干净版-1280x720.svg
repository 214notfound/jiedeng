<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>

  <!-- 室内：后墙 + 地面 -->
  <rect x="120" y="120" width="1040" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="120" y="480" width="1040" height="240" fill="#161e2a"/>
  <circle cx="640" cy="160" r="120" fill="url(#lamp)"/>

  <!-- R00 门禁（左墙，工作证读卡器） -->
  <g>
    <rect x="150" y="200" width="120" height="220" fill="#0e1218" stroke="#5a4836" stroke-width="3"/>
    <rect x="200" y="300" width="34" height="52" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="206" y="308" width="22" height="14" fill="#5aa7ff" opacity="0.8"/>
  </g>

  <!-- R02 恐吓执行表（左墙挂板） -->
  <g>
    <rect x="150" y="430" width="180" height="120" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="164" y="446" width="120" height="10" fill="#999"/>
    <rect x="164" y="466" width="140" height="8" fill="#999"/>
    <rect x="164" y="484" width="100" height="8" fill="#999"/>
    <rect x="164" y="502" width="140" height="8" fill="#c17a74"/>
  </g>

  <!-- R01 档案室旧电脑（右桌） -->
  <g>
    <rect x="920" y="330" width="180" height="90" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="945" y="200" width="110" height="90" fill="#0e2233" stroke="#4a5568" stroke-width="2"/>
    <rect x="950" y="208" width="100" height="62" fill="#14283a"/>
    <rect x="920" y="420" width="24" height="60" fill="#2b3442"/>
    <rect x="1076" y="420" width="24" height="60" fill="#2b3442"/>
  </g>

  <!-- R03 秘密封井任务单（右柜） -->
  <g>
    <rect x="920" y="440" width="180" height="150" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="934" y="458" width="150" height="24" fill="#2b3442"/>
    <rect x="934" y="492" width="150" height="24" fill="#2b3442"/>
    <rect x="946" y="500" width="60" height="10" fill="#c17a74"/>
  </g>

  <!-- R04 遮名背景调查（中央桌文件） -->
  <g>
    <rect x="480" y="330" width="320" height="110" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="540" y="290" width="150" height="96" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="552" y="304" width="120" height="10" fill="#999"/>
    <rect x="552" y="322" width="96" height="8" fill="#999"/>
    <rect x="552" y="338" width="120" height="8" fill="#999"/>
    <rect x="552" y="356" width="64" height="8" fill="#999"/>
  </g>
</svg>

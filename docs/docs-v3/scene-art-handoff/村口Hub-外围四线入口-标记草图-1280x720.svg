<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c28"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#night)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <!-- 中央村口广场 -->
  <rect x="500" y="300" width="280" height="200" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="520" y="330" width="90" height="70" fill="#0e1218"/>
  <rect x="660" y="330" width="90" height="70" fill="#0e1218"/>
  <polygon points="500,300 640,250 780,300" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
  <circle cx="640" cy="380" r="150" fill="url(#lamp)"/>
  <circle cx="640" cy="300" r="10" fill="#f5e9d0"/>
  <text x="640" y="180" fill="#b7c4d0" font-size="15" text-anchor="middle">村口广场（空屋 / 搬迁 / 施工痕迹）</text>

  <!-- G 山腰 / 墓地入口｜22,39 -->
  <g>
    <path d="M180,420 L360,200 L460,240 L320,460 Z" fill="#141c28" stroke="#4a5568" stroke-width="2"/>
    <circle cx="280" cy="280" r="46" fill="url(#lamp)" opacity="0.7"/>
    <rect x="246" y="250" width="68" height="60" fill="#232b38" stroke="#5a4836" stroke-width="2"/>
    <circle cx="280" cy="280" r="60" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="222" y1="280" x2="338" y2="280" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="280" y1="222" x2="280" y2="338" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="280" cy="280" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="280" y="150" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">G · 山腰/墓地入口｜22,39</text>
    <text x="280" y="170" fill="#b7c4d0" font-size="13" text-anchor="middle">导航入口（非调查热点）</text>
  </g>

  <!-- R 村委旧楼｜77,36 -->
  <g>
    <rect x="890" y="160" width="200" height="180" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <polygon points="885,160 990,110 1095,160" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="950" y="230" width="70" height="110" fill="#0e1218" stroke="#5a4836" stroke-width="2"/>
    <circle cx="990" cy="260" r="40" fill="url(#lamp)" opacity="0.7"/>
    <circle cx="990" cy="260" r="60" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="932" y1="260" x2="1048" y2="260" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="990" y1="202" x2="990" y2="318" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="990" cy="260" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="990" y="90" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">R · 村委旧楼门禁｜77,36</text>
    <text x="990" y="110" fill="#b7c4d0" font-size="13" text-anchor="middle">导航入口（非调查热点）</text>
  </g>

  <!-- S 废弃小学｜23,75 -->
  <g>
    <rect x="180" y="450" width="220" height="160" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <polygon points="175,450 290,400 405,450" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="250" y="510" width="80" height="100" fill="#0e1218" stroke="#5a4836" stroke-width="2"/>
    <circle cx="300" cy="540" r="40" fill="url(#lamp)" opacity="0.7"/>
    <circle cx="300" cy="540" r="60" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="242" y1="540" x2="358" y2="540" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="300" y1="482" x2="300" y2="598" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="300" cy="540" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="380" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">S · 废弃小学门｜23,75</text>
    <text x="300" y="400" fill="#b7c4d0" font-size="13" text-anchor="middle">导航入口（非调查热点）</text>
  </g>

  <!-- W 邮电所/拒签户｜77,75 -->
  <g>
    <rect x="880" y="450" width="220" height="160" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <polygon points="875,450 990,400 1105,450" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="950" y="510" width="80" height="100" fill="#0e1218" stroke="#5a4836" stroke-width="2"/>
    <circle cx="990" cy="540" r="40" fill="url(#lamp)" opacity="0.7"/>
    <circle cx="990" cy="540" r="60" fill="none" stroke="#ffb347" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="932" y1="540" x2="1048" y2="540" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <line x1="990" y1="482" x2="990" y2="598" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="990" cy="540" r="9" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
    <text x="990" y="380" fill="#ffb347" font-size="18" font-weight="bold" text-anchor="middle">W · 邮电所/拒签户｜77,75</text>
    <text x="990" y="400" fill="#b7c4d0" font-size="13" text-anchor="middle">导航入口（非调查热点）</text>
  </g>
</svg>

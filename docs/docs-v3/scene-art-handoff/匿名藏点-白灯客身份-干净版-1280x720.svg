<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c26"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5aa7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#hide)"/>

  <!-- 藏点内墙 -->
  <rect x="110" y="110" width="1060" height="500" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="110" y="610" width="1060" height="110" fill="#141b24"/>

  <!-- W20 暗号/加密入口（左侧门） -->
  <g>
    <rect x="180" y="180" width="240" height="180" fill="#0e151f" stroke="#4a5568" stroke-width="2"/>
    <line x1="180" y1="180" x2="420" y2="360" stroke="#4a5568" stroke-width="2"/>
    <text x="300" y="286" fill="#c8bfa8" font-size="15" font-family="Microsoft YaHei, sans-serif" text-anchor="middle">暗号</text>
    <circle cx="300" cy="240" r="70" fill="url(#lamp)"/>
  </g>

  <!-- W22 删除日志（右侧屏幕） -->
  <g>
    <rect x="900" y="180" width="200" height="140" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3"/>
    <rect x="912" y="194" width="176" height="12" fill="#5aa7ff" opacity="0.6"/>
    <rect x="912" y="214" width="140" height="12" fill="#5aa7ff" opacity="0.45"/>
    <rect x="912" y="234" width="160" height="12" fill="#5aa7ff" opacity="0.35"/>
    <rect x="912" y="254" width="120" height="12" fill="#ff4757" opacity="0.55"/>
    <circle cx="1000" cy="240" r="80" fill="url(#screen)"/>
  </g>

  <!-- W21 原文件与举报稿对比（中央） -->
  <g>
    <rect x="520" y="380" width="120" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="532" y="394" width="96" height="8" fill="#999"/>
    <rect x="532" y="410" width="80" height="8" fill="#999"/>
    <rect x="640" y="380" width="120" height="80" fill="#e8e2d4" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="652" y="394" width="70" height="8" fill="#c17a74"/>
    <rect x="652" y="410" width="96" height="8" fill="#999"/>
    <line x1="640" y1="420" x2="640" y2="420" stroke="#c17a74" stroke-width="2"/>
    <circle cx="620" cy="400" r="80" fill="url(#lamp)"/>
  </g>

  <!-- W23 未发送邮件与录音原声（下中） -->
  <g>
    <rect x="520" y="540" width="150" height="70" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="532" y="552" width="126" height="8" fill="#999"/>
    <rect x="532" y="568" width="100" height="8" fill="#999"/>
    <rect x="690" y="540" width="60" height="60" fill="#232b38" stroke="#4a6b8a" stroke-width="2" rx="4"/>
    <circle cx="720" cy="570" r="14" fill="#5aa7ff" opacity="0.7"/>
  </g>

  <!-- W25 排水洞坐标纸（右下） -->
  <g>
    <rect x="900" y="520" width="160" height="90" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="914" y="534" width="132" height="60" fill="#2b3442" stroke="#4a6b8a" stroke-width="2"/>
    <circle cx="980" cy="564" r="10" fill="#ffb347" opacity="0.85"/>
    <rect x="914" y="600" width="110" height="6" fill="#999"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2530"/>
      <stop offset="1" stop-color="#2a3a4a"/>
    </linearGradient>
    <radialGradient id="full" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#dawn)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <text x="640" y="90" fill="#b7c4d0" font-size="16" text-anchor="middle">结局五 · 不再借灯（ending-full-account）</text>

  <g>
    <rect x="300" y="400" width="60" height="80" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="4"/>
    <rect x="316" y="420" width="28" height="60" fill="#f5c542" opacity="0.4"/>
    <text x="330" y="350" fill="#b7c4d0" font-size="14" font-weight="bold" text-anchor="middle">被放下的白灯</text>
  </g>

  <g>
    <rect x="560" y="360" width="160" height="180" fill="none" stroke="#b7c4d0" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <text x="640" y="320" fill="#b7c4d0" font-size="15" font-weight="bold" text-anchor="middle">主角立绘（覆盖层，非背景）· 走向光，接受调查</text>
  </g>

  <circle cx="980" cy="340" r="180" fill="url(#full)"/>
  <rect x="940" y="420" width="80" height="140" fill="#1c2430" stroke="#8a7a5c" stroke-width="2"/>
  <text x="980" y="150" fill="#f5c542" font-size="15" font-weight="bold" text-anchor="middle">全亮的光（全部责任公开）</text>

  <rect x="300" y="640" width="680" height="52" fill="#0d1118" stroke="#f5c542" stroke-width="2" rx="6"/>
  <text x="640" y="672" fill="#f5c542" font-size="16" font-weight="bold" text-anchor="middle">条件 full-evidence-published：全部责任公开，主角也接受调查（不是无罪结局）</text>
</svg>

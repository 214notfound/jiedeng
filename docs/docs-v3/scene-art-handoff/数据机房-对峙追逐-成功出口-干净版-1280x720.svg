<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="dc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#06090e"/>
    </linearGradient>
    <radialGradient id="ok" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd1c8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7fd1c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#dc)"/>

  <rect x="110" y="100" width="1060" height="500" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>

  <!-- 证据外发成功屏幕 -->
  <g>
    <rect x="440" y="220" width="400" height="200" fill="#0a0f16" stroke="#7fd1c8" stroke-width="3" rx="4"/>
    <rect x="456" y="238" width="368" height="14" fill="#7fd1c8" opacity="0.6"/>
    <rect x="456" y="262" width="300" height="14" fill="#7fd1c8" opacity="0.5"/>
    <rect x="456" y="286" width="340" height="14" fill="#7fd1c8" opacity="0.4"/>
    <rect x="456" y="310" width="260" height="14" fill="#7fd1c8" opacity="0.3"/>
    <text x="640" y="360" fill="#7fd1c8" font-size="22" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">证据已外发</text>
    <circle cx="640" cy="320" r="130" fill="url(#ok)"/>
  </g>

  <!-- 出口/逃离方向 -->
  <rect x="1060" y="160" width="120" height="380" fill="#0c1018" stroke="#4a6b8a" stroke-width="2"/>
  <circle cx="1120" cy="350" r="60" fill="url(#ok)"/>

</svg>

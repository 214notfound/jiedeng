  <g>
    <rect x="215" y="160" width="170" height="120" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3" rx="4"/>
    <rect x="229" y="176" width="142" height="12" fill="#5aa7ff" opacity="0.6"/>
    <rect x="229" y="196" width="110" height="12" fill="#5aa7ff" opacity="0.45"/>

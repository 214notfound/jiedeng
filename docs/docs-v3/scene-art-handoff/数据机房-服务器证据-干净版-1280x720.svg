  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#dc)"/>

  <!-- 机房服务器架 -->
  <rect x="110" y="100" width="1060" height="540" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>

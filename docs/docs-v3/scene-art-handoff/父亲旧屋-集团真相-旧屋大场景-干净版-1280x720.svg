<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>

  <!-- 旧屋后墙与地板 -->
  <rect x="120" y="120" width="1040" height="360" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="120" y="480" width="1040" height="240" fill="#151b24"/>

  <!-- 后墙：旧窗、旧挂钟、旧柜 -->
  <rect x="220" y="180" width="180" height="140" fill="#0e151f" stroke="#4a5568" stroke-width="2"/>
  <line x1="310" y1="180" x2="310" y2="320" stroke="#4a5568" stroke-width="2"/>
  <line x1="220" y1="250" x2="400" y2="250" stroke="#4a5568" stroke-width="2"/>
  <circle cx="880" cy="240" r="44" fill="#1a2230" stroke="#4a5568" stroke-width="3"/>
  <line x1="880" y1="240" x2="880" y2="214" stroke="#c8bfa8" stroke-width="3"/>
  <line x1="880" y1="240" x2="900" y2="244" stroke="#c8bfa8" stroke-width="3"/>
  <rect x="940" y="160" width="140" height="240" fill="#232b38" stroke="#4a5568" stroke-width="2"/>

  <!-- 旧桌椅 -->
  <rect x="180" y="400" width="200" height="80" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
  <rect x="190" y="340" width="180" height="60" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
  <rect x="760" y="360" width="70" height="120" fill="#2b221a" stroke="#4a3a2a" stroke-width="2"/>

  <!-- 地窖口（唯一入口，暖光为环境光，进入暗层） -->
  <g>
    <rect x="560" y="500" width="160" height="70" fill="#241d16" stroke="#5a4836" stroke-width="3" rx="3"/>
    <line x1="560" y1="500" x2="720" y2="570" stroke="#5a4836" stroke-width="2"/>
    <circle cx="640" cy="520" r="110" fill="url(#lamp)"/>
    <rect x="600" y="512" width="80" height="20" fill="#8a7a5c" opacity="0.7"/>
  </g>
</svg>

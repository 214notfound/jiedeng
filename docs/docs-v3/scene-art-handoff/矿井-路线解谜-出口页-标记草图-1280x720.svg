<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="mine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#mine)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <rect x="120" y="120" width="1040" height="480" fill="#1a2028" stroke="#3a4a5c" stroke-width="2"/>

  <circle cx="360" cy="360" r="56" fill="#0a0f16" stroke="#4a6b8a" stroke-width="3"/>
  <circle cx="360" cy="360" r="56" fill="none" stroke="#5aa7ff" stroke-width="2" stroke-dasharray="6 4"/>

  <g>
    <rect x="700" y="260" width="260" height="180" fill="#1c2028" stroke="#4a6b8a" stroke-width="3"/>
    <rect x="720" y="300" width="220" height="120" fill="#0a0f16"/>
    <rect x="760" y="360" width="140" height="60" fill="#2b3442"/>
    <circle cx="830" cy="360" r="130" fill="url(#lamp)"/>
    <text x="830" y="270" fill="#f5c542" font-size="18" font-weight="bold" text-anchor="middle">内部平台 · 竖井边</text>
    <circle cx="830" cy="360" r="60" fill="none" stroke="#f5c542" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="830" cy="360" r="9" fill="#f5c542" stroke="#ffffff" stroke-width="3"/>
    <text x="830" y="470" fill="#f5c542" font-size="18" font-weight="bold" text-anchor="middle">出口 → 进入矿井内部平台（Scene 12 苏禾死亡现场）</text>
  </g>

  <g>
    <rect x="400" y="460" width="200" height="180" fill="none" stroke="#7fd1c8" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <text x="500" y="620" fill="#7fd1c8" font-size="15" font-weight="bold" text-anchor="middle">小周立绘（覆盖层，非背景）· 同行</text>
  </g>

  <rect x="360" y="600" width="560" height="52" fill="#0d1118" stroke="#f5c542" stroke-width="2" rx="6"/>
  <text x="640" y="632" fill="#f5c542" font-size="17" font-weight="bold" text-anchor="middle">小游戏完成：sealed-mine-bypassed（排水洞被绕过）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>

  <!-- 教室后墙 + 地面 -->
  <rect x="140" y="110" width="1000" height="380" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="140" y="490" width="1000" height="230" fill="#161e2a"/>
  <circle cx="640" cy="150" r="120" fill="url(#lamp)"/>

  <!-- S00 留言/寻人启事（左墙黑板） -->
  <g>
    <rect x="180" y="150" width="260" height="150" fill="#14282e" stroke="#4a5568" stroke-width="2"/>
    <rect x="200" y="170" width="80" height="100" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2" rx="2"/>
    <rect x="208" y="182" width="56" height="10" fill="#999"/>
    <rect x="208" y="200" width="64" height="8" fill="#999"/>
    <rect x="208" y="216" width="48" height="8" fill="#999"/>
  </g>

  <!-- S01 广播/电/排水线路（右墙管线） -->
  <g>
    <path d="M940,120 L960,120 L960,240 L900,300" fill="none" stroke="#2b3442" stroke-width="6"/>
    <path d="M960,180 L1040,180 L1040,260" fill="none" stroke="#3a4a5c" stroke-width="4"/>
    <rect x="930" y="112" width="40" height="16" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <circle cx="1040" cy="268" r="12" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
  </g>

  <!-- S02 旧矿图复印件藏点（左讲台抽屉） -->
  <g>
    <rect x="220" y="440" width="200" height="110" fill="#3a2f24" stroke="#5a4836" stroke-width="3"/>
    <rect x="240" y="400" width="160" height="44" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
    <rect x="300" y="500" width="80" height="40" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
    <rect x="310" y="512" width="60" height="4" fill="#ece7dc"/>
  </g>

  <!-- S03 封井材料照片（中央课桌） -->
  <g>
    <rect x="520" y="440" width="220" height="100" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="560" y="390" width="80" height="60" fill="#ece7dc" stroke="#8a7a5c" stroke-width="2"/>
    <rect x="566" y="396" width="68" height="40" fill="#2b3442"/>
  </g>

  <!-- S04 手机移动记录（右窗台/桌） -->
  <g>
    <rect x="880" y="440" width="200" height="90" fill="#3a2f24" stroke="#5a4836" stroke-width="2"/>
    <rect x="960" y="392" width="46" height="70" rx="6" fill="#0e1218" stroke="#4a5568" stroke-width="2"/>
    <rect x="966" y="400" width="34" height="44" fill="#14283a"/>
  </g>
</svg>

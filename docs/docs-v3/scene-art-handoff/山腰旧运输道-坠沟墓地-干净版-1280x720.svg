<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c28"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#night)"/>

  <!-- 山体与运输道（斜向山路） -->
  <path d="M0,520 L640,300 L1280,360 L1280,720 L0,720 Z" fill="#121a26"/>
  <path d="M120,560 L600,330 L1240,380 L1240,460 L640,400 L80,620 Z" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>

  <!-- G00 坍方边缘（左上，护栏破损的崖边） -->
  <g>
    <path d="M240,120 L420,120 L360,260 L280,250 Z" fill="#0e1218" stroke="#4a5568" stroke-width="2"/>
    <line x1="250" y1="160" x2="280" y2="160" stroke="#5a4836" stroke-width="4"/>
    <line x1="300" y1="160" x2="330" y2="160" stroke="#5a4836" stroke-width="4"/>
    <line x1="360" y1="170" x2="380" y2="200" stroke="#5a4836" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- G01 浅沟 / 深排水洞（右中，灌木半掩的涵洞） -->
  <g>
    <ellipse cx="768" cy="320" rx="120" ry="60" fill="#0e1218" stroke="#3a4a5c" stroke-width="2"/>
    <ellipse cx="768" cy="310" rx="60" ry="30" fill="#05070c"/>
    <path d="M660,330 C700,290 760,280 860,300" fill="none" stroke="#2b3442" stroke-width="6"/>
  </g>

  <!-- G02 两座坟（左下，均为普通墓碑；妹妹实葬坟 + 陈晋年衣冠冢） -->
  <g>
    <rect x="300" y="360" width="50" height="80" rx="14" fill="#232b38" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="368" y="372" width="46" height="72" rx="12" fill="#232b38" stroke="#3a4a5c" stroke-width="2"/>
    <path d="M290,360 L355,360" stroke="#5a4836" stroke-width="4"/>
    <path d="M360,372 L420,372" stroke="#5a4836" stroke-width="4"/>
    <text x="325" y="398" fill="#8a7a5c" font-size="13" text-anchor="middle" font-family="serif">妹</text>
    <text x="391" y="408" fill="#8a7a5c" font-size="13" text-anchor="middle" font-family="serif">陈</text>
  </g>

  <!-- G03 墓地管理房 / 夹层（右上） -->
  <g>
    <rect x="880" y="380" width="150" height="120" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <polygon points="875,380 955,330 1035,380" fill="#141c28" stroke="#3a4a5c" stroke-width="2"/>
    <rect x="900" y="430" width="44" height="70" fill="#0e1218" stroke="#5a4836" stroke-width="2"/>
    <rect x="910" y="400" width="50" height="22" fill="#232b38" stroke="#3a4a5c" stroke-width="2"/>
  </g>

</svg>

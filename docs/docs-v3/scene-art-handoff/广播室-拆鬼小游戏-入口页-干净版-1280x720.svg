<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e9d0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5e9d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#room)"/>
  <rect x="120" y="100" width="1040" height="400" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
  <rect x="120" y="500" width="1040" height="220" fill="#161e2a"/>
  <circle cx="640" cy="150" r="120" fill="url(#lamp)"/>

  <!-- D00 广播定时器/扬声器（左上墙） -->
  <g>
    <rect x="170" y="150" width="70" height="46" fill="#232b38" stroke="#4a5568" stroke-width="2"/>
    <rect x="178" y="158" width="40" height="16" fill="#0e1218"/>
    <rect x="240" y="160" width="110" height="70" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
    <circle cx="295" cy="195" r="22" fill="#0e1218" stroke="#5aa7ff" stroke-width="2"/>
  </g>

  <!-- D01 灯具支线/白灯（上中） -->
  <g>
    <path d="M560,120 L720,120" stroke="#2b3442" stroke-width="5"/>
    <circle cx="620" cy="180" r="40" fill="url(#lamp)"/>
    <circle cx="620" cy="150" r="14" fill="#f5e9d0"/>
  </g>

  <!-- D02 排水线槽/鞋底模（右上墙+地） -->
  <g>
    <path d="M920,120 L1080,120 L1080,300" fill="none" stroke="#2b3442" stroke-width="6"/>
    <rect x="900" y="280" width="180" height="26" fill="#0e1218" stroke="#3a4a5c" stroke-width="2"/>
    <ellipse cx="1000" cy="200" rx="30" ry="16" fill="#2b3442" stroke="#4a5568" stroke-width="2"/>
  </g>

  <!-- D03 总闸（左下） -->
  <g>
    <rect x="170" y="440" width="160" height="180" fill="#232b38" stroke="#4a5568" stroke-width="3"/>
    <rect x="190" y="460" width="120" height="60" fill="#0e1218"/>
    <rect x="200" y="470" width="24" height="40" fill="#c17a74"/>
    <rect x="236" y="470" width="24" height="40" fill="#5a4836"/>
    <rect x="272" y="470" width="24" height="40" fill="#5a4836"/>
  </g>

  <!-- D04 远程重启屏（下中） -->
  <g>
    <rect x="540" y="470" width="160" height="110" fill="#0e2233" stroke="#4a5568" stroke-width="2"/>
    <rect x="552" y="484" width="136" height="70" fill="#14283a"/>
    <rect x="552" y="484" width="60" height="8" fill="#5aa7ff" opacity="0.7"/>
    <rect x="552" y="500" width="90" height="8" fill="#3a4a5c"/>
  </g>

  <!-- D05 备用供电柜（右下） -->
  <g>
    <rect x="900" y="440" width="200" height="180" fill="#232b38" stroke="#4a5568" stroke-width="3"/>
    <rect x="920" y="460" width="160" height="60" fill="#0e1218"/>
    <rect x="920" y="540" width="160" height="60" fill="#0e1218"/>
    <circle cx="1000" cy="470" r="10" fill="#5aa7ff" opacity="0.8"/>
  </g>
</svg>

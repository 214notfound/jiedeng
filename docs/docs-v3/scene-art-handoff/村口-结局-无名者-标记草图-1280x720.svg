<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3a4a5c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#fog)"/>
  <rect x="3" y="3" width="1274" height="714" fill="none" stroke="#f5c542" stroke-width="5"/>
  <text x="14" y="30" fill="#f5c542" font-size="16" font-weight="bold">左上角 (0,0)</text>
  <text x="1158" y="704" fill="#f5c542" font-size="16" font-weight="bold">右下角 (100,100)</text>

  <text x="640" y="90" fill="#b7c4d0" font-size="16" text-anchor="middle">结局三 · 无名者（ending-erasure）</text>

  <g>
    <rect x="180" y="300" width="200" height="220" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <line x1="180" y1="300" x2="380" y2="460" stroke="#3a4a5c" stroke-width="3"/>
    <rect x="900" y="320" width="200" height="200" fill="#1c2430" stroke="#3a4a5c" stroke-width="2"/>
    <line x1="900" y1="320" x2="1100" y2="470" stroke="#3a4a5c" stroke-width="3"/>
    <text x="640" y="220" fill="#b7c4d0" font-size="18" font-weight="bold" text-anchor="middle">焦点 · 村庄被拆（残垣 + 斜线）</text>
  </g>
  <rect x="0" y="420" width="1280" height="200" fill="url(#mist)"/>

  <g>
    <rect x="560" y="400" width="160" height="200" fill="none" stroke="#b7c4d0" stroke-width="2" stroke-dasharray="6 4" rx="6"/>
    <text x="640" y="610" fill="#b7c4d0" font-size="15" font-weight="bold" text-anchor="middle">主角立绘（覆盖层，非背景）· 走进雾里，隐姓埋名</text>
  </g>

  <rect x="360" y="640" width="560" height="52" fill="#0d1118" stroke="#7fd1c8" stroke-width="2" rx="6"/>
  <text x="640" y="672" fill="#7fd1c8" font-size="16" font-weight="bold" text-anchor="middle">条件 all-evidence-destroyed：主角隐姓埋名，村庄被拆</text>
</svg>

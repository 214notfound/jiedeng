    <rect x="440" y="220" width="400" height="200" fill="#0a0f16" stroke="#ff4757" stroke-width="3" rx="4"/>
    <rect x="456" y="238" width="368" height="14" fill="#ff4757" opacity="0.6"/>
    <rect x="456" y="262" width="320" height="14" fill="#ff4757" opacity="0.5"/>
    <rect x="456" y="286" width="280" height="14" fill="#ff4757" opacity="0.4"/>
    <rect x="456" y="310" width="240" height="14" fill="#ff4757" opacity="0.3"/>
    <text x="640" y="360" fill="#ff4757" font-size="22" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">副本已删除</text>
    <circle cx="640" cy="320" r="130" fill="url(#fail)"/>
  </g>

</svg>

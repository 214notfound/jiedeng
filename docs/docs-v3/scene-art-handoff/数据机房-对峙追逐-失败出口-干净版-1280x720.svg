<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="dc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="fail" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4757" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#dc)"/>

  <rect x="110" y="100" width="1060" height="500" fill="#121620" stroke="#3a4a5c" stroke-width="2"/>

  <!-- 副本删除屏幕（证据被回收/清除，不画血腥） -->
